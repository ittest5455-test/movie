<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #player {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    .jwplayer {
      width: 100% !important;
      height: 100% !important;
    }
    .art-contextmenus, .jw-rightclick { display: none !important; }
    
    ::cue {
      color: #ffff00 !important;
      font-size: clamp(16px, 3.5vw, 22px) !important;
      background-color: transparent !important;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 2px 4px rgba(0,0,0,0.7) !important;
    }
    video::-webkit-media-text-track-display {
      transform: translateY(-8%) !important;
    }
  </style>
  <script src="https://ssl.p.jwpcdn.com/player/v/8.38.2/jwplayer.js"></script>
</head>
<body>
  <div id="player"></div>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || urlParams.get('v');
      if (!id) return;

      const src = (urlParams.get('src') || '').toLowerCase();
      const apiOrigin = (window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') || window.location.protocol === 'file:')
        ? 'https://free-moviesnew.pages.dev'
        : '';
      const streamUrl = (src === 'player77' || src === 'vdohls' || src === '24player')
        ? apiOrigin + '/api/vdohls?id=' + encodeURIComponent(id) + (src === '24player' ? '&src=24player' : '')
        : apiOrigin + '/api/wow?id=' + encodeURIComponent(id) + (src ? '&src=' + encodeURIComponent(src) : '');
      const color = '#e50914';

      // =========================================================
      // ระบบ Auto-Sync & Anti-Freeze Watcher
      // แก้ปัญหาไฟล์ต้นทางตัดต่อภาพหาย (PTS gap / Video Frame Stall)
      // ที่ทำให้ภาพค้างแต่เสียงยังเล่นต่อ: ตรวจจับและดีดข้ามจุดสะดุดอัตโนมัติ
      // =========================================================
      function attachAntiFreezeWatcher(v) {
        if (!v || v._hasAntiFreeze) return;
        v._hasAntiFreeze = true;

        let lastFrameTime = performance.now();
        let lastDecodedFrames = 0;
        let lastCurrentTime = 0;

        function onFrame() {
          lastFrameTime = performance.now();
          if (v && v.requestVideoFrameCallback) {
            v.requestVideoFrameCallback(onFrame);
          }
        }
        if (v.requestVideoFrameCallback) {
          v.requestVideoFrameCallback(onFrame);
        }

        setInterval(function() {
          if (!v || v.paused || v.seeking || v.ended || v.currentTime < 1) {
            lastFrameTime = performance.now();
            lastCurrentTime = v ? v.currentTime : 0;
            return;
          }

          const now = performance.now();
          const timeAdvanced = Math.abs(v.currentTime - lastCurrentTime);
          let isStalled = false;

          if (v.requestVideoFrameCallback) {
            // ถ้าเสียง/เวลาวิ่งไปต่อเนื่อง แต่ภาพไม่ขยับเลยเกิน 1.2 วินาที
            if (now - lastFrameTime > 1200 && timeAdvanced > 0.4) {
              isStalled = true;
            }
          } else if (typeof v.getVideoPlaybackQuality === 'function') {
            const q = v.getVideoPlaybackQuality();
            if (q && q.totalVideoFrames !== undefined) {
              if (q.totalVideoFrames === lastDecodedFrames && timeAdvanced > 0.8) {
                isStalled = true;
              } else {
                lastDecodedFrames = q.totalVideoFrames;
                lastFrameTime = now;
              }
            }
          } else if (v.webkitDecodedFrameCount !== undefined) {
            if (v.webkitDecodedFrameCount === lastDecodedFrames && timeAdvanced > 0.8) {
              isStalled = true;
            } else {
              lastDecodedFrames = v.webkitDecodedFrameCount;
              lastFrameTime = now;
            }
          }

          lastCurrentTime = v.currentTime;

          if (isStalled) {
            console.warn('[Anti-Freeze Auto-Sync] Video frame stall detected at ' + v.currentTime.toFixed(2) + 's! Nudging +0.3s...');
            try {
              v.currentTime += 0.3;
            } catch(e) {}
            lastFrameTime = performance.now();
          }
        }, 500);
      }

      // คอยตรวจจับแท็ก video ทั้งใน JWPlayer และ Native Video ตลอดเวลา
      setInterval(function() {
        const videos = document.querySelectorAll('video');
        videos.forEach(function(v) {
          attachAntiFreezeWatcher(v);
        });
      }, 1000);

      function setupNativeVideo(v) {
        attachAntiFreezeWatcher(v);
        let vTimer = null;
        v.addEventListener('waiting', function() {
          if (vTimer) clearTimeout(vTimer);
          vTimer = setTimeout(function() {
            if (!v.paused && v.readyState < 3) {
              console.warn('[Auto-Recovery] Native video stall -> nudge 0.5s');
              v.currentTime += 0.5;
              v.play().catch(function() {});
            }
          }, 2500);
        });
        v.addEventListener('playing', function() { if (vTimer) clearTimeout(vTimer); });
        v.addEventListener('timeupdate', function() { if (vTimer) clearTimeout(vTimer); });
      }

      function initJW() {
        if (!window.jwplayer) {
          const v = document.createElement("video");
          v.controls = true;
          v.playsInline = true;
          v.autoplay = true;
          v.style.width = "100%";
          v.style.height = "100%";
          v.src = streamUrl;
          setupNativeVideo(v);
          document.getElementById("player").appendChild(v);
          v.play().catch(function() {});
          return;
        }

        try {
          const player = jwplayer("player");
          player.setup({
            key: "W7zSm81+mmIsg7F+fyHRKhF3ggLkTqtGMhvI92kbqf/ysE99",
            width: "100%",
            height: "100%",
            preload: "auto",
            hlshtml: true,
            autostart: true,
            sources: [{ file: streamUrl, type: "hls" }],
            skin: {
              controlbar: { iconsActive: color },
              timeslider: { progress: color },
              menus: { textActive: color }
            },
            captions: {
              color: '#ffff00',
              fontSize: 20,
              backgroundOpacity: 0,
              edgeStyle: 'uniform',
              windowOpacity: 0
            },
            // =========================================================
            // การตั้งค่า Buffer ระดับสูง: เริ่มเล่นทันทีใน 1 วิ ไม่มีหมุนสะดุด
            // และคืนหน่วยความจำสม่ำเสมอ ป้องกันเครื่องค้างเมื่อดูนานๆ
            // =========================================================
            hlsjsConfig: {
              maxBufferLength: 30,             // ตุนล่วงหน้า 30 วินาที พอเหมาะ ไม่กินแรม
              maxMaxBufferLength: 60,          // ตุนล่วงหน้าสูงสุดไม่เกิน 60 วินาที
              backBufferLength: 30,            // คืนแรม/ล้างวิดีโอส่วนที่ดูผ่านไปแล้วทิ้ง ป้องกันแรมบวม ค้างเมื่อดูนานๆ
              maxBufferSize: 60 * 1024 * 1024, // ขยายเพดาน buffer เป็น 60MB รองรับ 1080p บิตเรตสูง
              maxBufferHole: 0.5,              // สมานรอยต่อไฟล์อัตโนมัติ ไม่ให้สะดุด
              nudgeOffset: 0.2,                // ปรับข้ามเฟรมกระตุกอัตโนมัติ
              nudgeMaxRetry: 30,
              manifestLoadingTimeOut: 20000,
              manifestLoadingMaxRetry: 6,
              levelLoadingTimeOut: 20000,
              levelLoadingMaxRetry: 6,
              fragLoadingTimeOut: 30000,       // ยืดเวลาโหลดชิ้นส่วนป้องกัน timeout ช่วงเน็ตแกว่ง
              fragLoadingMaxRetry: 8,
              enableWorker: true,
              lowLatencyMode: false
            }
          });

          // ตรวจจับและกู้คืนสถานะค้างหมุน (Stall Buffer Recovery) เมื่อดูไปนานๆ
          let bufferStallTimer = null;
          player.on('buffer', function() {
            if (bufferStallTimer) clearTimeout(bufferStallTimer);
            bufferStallTimer = setTimeout(function() {
              const state = typeof player.getState === 'function' ? player.getState() : '';
              if (state === 'buffering' || state === 'loading') {
                console.warn('[Auto-Recovery] Playback buffer stalled for >3.5s -> Auto-nudging +0.3s...');
                try {
                  const pos = player.getPosition();
                  player.seek(pos + 0.3);
                  player.play();
                } catch(e) {}
              }
            }, 3500);
          });
          player.on('play', function() {
            if (bufferStallTimer) { clearTimeout(bufferStallTimer); bufferStallTimer = null; }
          });
          player.on('time', function() {
            if (bufferStallTimer) { clearTimeout(bufferStallTimer); bufferStallTimer = null; }
          });

          // ป้องกันข้อผิดพลาดและเล่นต่อเนื่องอัตโนมัติแบบ 100% ไม่มีโฆษณา
          let retryCount = 0;
          player.on('error', function(err) {
            console.warn('[JWPlayer Error Event]', err);
            if (retryCount < 3) {
              retryCount++;
              console.log('[Auto-Recovery] Retrying stream reload (' + retryCount + '/3)...');
              setTimeout(function() {
                try {
                  const currentPos = typeof player.getPosition === "function" ? player.getPosition() : 0;
                  player.load([{ file: streamUrl, type: "hls" }]);
                  player.play();
                  if (currentPos > 5) {
                    player.seek(currentPos);
                  }
                } catch(e) {}
              }, 1000);
            } else {
              // ถ้า JWPlayer ขัดข้อง ให้ใช้ Native Video แทน โดยไม่เปิดหน้าเว็บที่มีโฆษณาเด็ดขาด
              const p = document.getElementById("player");
              if (p) {
                p.innerHTML = "";
                const v = document.createElement("video");
                v.controls = true;
                v.playsInline = true;
                v.autoplay = true;
                v.style.width = "100%";
                v.style.height = "100%";
                v.src = streamUrl;
                setupNativeVideo(v);
                p.appendChild(v);
                v.play().catch(function() {});
              }
            }
          });

          player.on('setupError', function(err) {
            console.warn('[JWPlayer setupError Event]', err);
            const p = document.getElementById("player");
            if (p) {
              p.innerHTML = "";
              const v = document.createElement("video");
              v.controls = true;
              v.playsInline = true;
              v.autoplay = true;
              v.style.width = "100%";
              v.style.height = "100%";
              v.src = streamUrl;
              setupNativeVideo(v);
              p.appendChild(v);
              v.play().catch(function() {});
            }
          });

          player.on('ready', function() {
            try {
              const v = document.querySelector('#player video, video');
              if (v) attachAntiFreezeWatcher(v);
            } catch(e) {}
            try {
              const rewindContainer = document.querySelector('.jw-display-icon-rewind');
              if (rewindContainer) {
                const forwardContainer = rewindContainer.cloneNode(true);
                const forwardDisplayButton = forwardContainer.querySelector('.jw-icon-rewind');
                if (forwardDisplayButton) forwardDisplayButton.style.transform = "scaleX(-1)";
                const nextContainer = document.querySelector('.jw-display-icon-next');
                if (nextContainer) {
                  nextContainer.parentNode.insertBefore(forwardContainer, nextContainer);
                  nextContainer.style.display = 'none';
                }
                const btnContainer = document.querySelector('.jw-button-container');
                const rewindCtrl = btnContainer ? btnContainer.querySelector(".jw-icon-rewind") : null;
                if (rewindCtrl) {
                  const forwardCtrl = rewindCtrl.cloneNode(true);
                  forwardCtrl.style.transform = "scaleX(-1)";
                  rewindCtrl.parentNode.insertBefore(forwardCtrl, rewindCtrl.nextElementSibling);
                  [forwardDisplayButton, forwardCtrl].forEach(function(btn) {
                    if (btn) btn.onclick = function() { player.seek(player.getPosition() + 10); };
                  });
                }
              }
            } catch(e) {}
          });
        } catch (err) {
          console.error("JWPlayer setup error:", err);
          const v = document.createElement("video");
          v.controls = true;
          v.playsInline = true;
          v.autoplay = true;
          v.style.width = "100%";
          v.style.height = "100%";
          v.src = streamUrl;
          setupNativeVideo(v);
          document.getElementById("player").appendChild(v);
          v.play().catch(function() {});
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initJW);
      } else {
        initJW();
      }
    })();
  </script>
</body>
</html>
